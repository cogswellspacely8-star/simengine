// Reliability diagram: observed frequency vs predicted probability per bucket.
// Points on the dashed y=x line are perfectly calibrated.
function drawReliability(canvas, curve) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.clientWidth || 360;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const pad = 34;
  const X = p => pad + p * (W - 2 * pad);
  const Y = f => H - pad - f * (H - 2 * pad);
  // axes
  ctx.strokeStyle = '#2a3550'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke();
  // perfect-calibration diagonal
  ctx.strokeStyle = '#475569'; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke(); ctx.setLineDash([]);
  // points
  for (const b of curve) {
    const px = X(b.mean_predicted), py = Y(b.observed_freq);
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath(); ctx.arc(px, py, 4, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
    ctx.fillText('n=' + b.count, px + 6, py - 6);
  }
  ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif';
  ctx.fillText('predicted →', W - 72, H - 8);
  ctx.save(); ctx.translate(11, pad + 46); ctx.rotate(-Math.PI / 2);
  ctx.fillText('observed →', 0, 0); ctx.restore();
}

async function loadPredictions() {
  const scoreEl = document.getElementById('pred-score');
  const listEl = document.getElementById('pred-list');
  if (!listEl) return;
  try {
    const res = await fetch('/api/forecasts');
    const data = await res.json();
    const s = data.score || {};
    if (s.n > 0) {
      scoreEl.innerHTML = `<div style="padding:10px;border-radius:8px;background:#1f2a3a">Track record: <b>${s.n}</b> resolved &middot; Brier <b>${s.brier.toFixed(3)}</b> &middot; log-loss <b>${s.log_loss.toFixed(3)}</b> <span style="opacity:.7">(lower is better; 0.25 = always guessing 50/50)</span></div>`;
    } else {
      scoreEl.innerHTML = `<div style="padding:10px;border-radius:8px;background:#1f2a3a;opacity:.85">No predictions graded yet — click Hit or Miss on one below once the outcome is known, and your Brier score appears.</div>`;
    }
    // Gated reliability diagram (appended INSIDE scoreEl so it is replaced, not
    // stacked, on each reload).
    const cal = data.calibration || {};
    if (cal.ready && cal.curve && cal.curve.length) {
      scoreEl.insertAdjacentHTML('beforeend', `<div style="margin-top:10px">
          <canvas id="rel-canvas" height="220" style="width:100%"></canvas>
          <div class="form-hint">Reliability — expected calibration error ${(cal.ece*100).toFixed(1)}% &middot; base rate ${(cal.base_rate*100).toFixed(0)}% over ${cal.n} resolved (perfectly calibrated = points on the dashed line).</div>
        </div>`);
      const relC = document.getElementById('rel-canvas');
      if (relC) drawReliability(relC, cal.curve);
    } else if (cal.n != null && cal.n > 0) {
      scoreEl.insertAdjacentHTML('beforeend', `<div class="form-hint" style="margin-top:10px">${cal.n}/${cal.min_n} resolved — the calibration curve unlocks at ${cal.min_n}.</div>`);
    }
    const fc = data.forecasts || [];
    if (!fc.length) {
      listEl.innerHTML = '<div class="form-hint">No predictions logged yet. Run a simulation and log its result, or add one by hand below.</div>';
      return;
    }
    listEl.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
      '<thead><tr style="opacity:.7;text-align:left"><th style="padding:5px 6px">Prediction</th><th style="padding:5px 6px">Prob</th><th style="padding:5px 6px">Resolves</th><th style="padding:5px 6px;text-align:right">Outcome</th></tr></thead><tbody>' +
      fc.map(f => {
        const prob = (f.predicted_prob * 100).toFixed(0) + '%';
        let outcome;
        if (f.outcome === null || f.outcome === undefined) {
          outcome = `<button class="btn-add-var" style="padding:2px 8px" onclick="resolvePrediction(${f.id},1)">Hit</button> ` +
                    `<button class="btn-add-var" style="padding:2px 8px;background:#5a2a2a" onclick="resolvePrediction(${f.id},0)">Miss</button>`;
        } else {
          outcome = f.outcome ? '<span style="color:#6ee7a0;font-weight:600">Hit</span>'
                              : '<span style="color:#ffb3b3;font-weight:600">Miss</span>';
        }
        return `<tr style="border-top:1px solid #2a2f3a"><td style="padding:6px">${askEsc(f.question)}</td>` +
               `<td style="padding:6px">${prob}</td>` +
               `<td style="padding:6px;opacity:.8">${askEsc(f.resolve_by || '—')}</td>` +
               `<td style="padding:6px;text-align:right">${outcome}</td></tr>`;
      }).join('') + '</tbody></table>';
  } catch (e) {
    listEl.innerHTML = `<div style="color:#ffb3b3">Could not load predictions: ${askEsc(String(e))}</div>`;
  }
}

// Escape a string for safe embedding inside a single-quoted JS string that
// itself lives in a double-quoted HTML attribute (onclick="fn('...')"). esc()
// and askEsc() only escape HTML text, NOT quotes, so they are unsafe here.
function jsStr(s) {
  return String(s)
    .replace(/\\/g, '\\\\')   // JS: backslash
    .replace(/'/g, "\\'")     // JS: single quote (would close the JS string)
    .replace(/&/g, '&amp;')   // HTML entities (browser decodes before JS sees it)
    .replace(/"/g, '&quot;')  // HTML: would close the attribute
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// Capture: log a binary-indicator forecast into the calibration ledger.
// `question`/`resolveBy` override the defaults (used by the Ask flow, where
// currentConfig is not the question's source). The metric is held in a closure
// variable rather than interpolated into the submit button's onclick, and the
// input values are set via JS so quotes can never break the markup.
let _trackMetric = '';
function openTrackForecast(metric, prob, question, resolveBy) {
  _trackMetric = metric;
  const q = question
    || (currentConfig && currentConfig.context && currentConfig.context.decision)
    || metric.replace(/_/g, ' ');
  const by = (resolveBy != null) ? resolveBy : ((currentConfig && currentConfig.resolve_by) || '');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'track-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px">
      <h2>Track this forecast</h2>
      <div class="form-hint">Logs this probability now so it can be graded against reality later — that track record is what turns the engine from a calculator into a forecasting instrument.</div>
      <div class="form-group" style="margin-top:10px"><label class="form-label">Question</label>
        <input class="form-input" id="track-q"></div>
      <div class="form-group"><label class="form-label">Probability (%)</label>
        <input class="form-input" id="track-p" type="number" min="0" max="100"></div>
      <div class="form-group"><label class="form-label">Resolve by (optional)</label>
        <input class="form-input" id="track-by" type="date"></div>
      <div class="modal-actions" style="margin-top:14px">
        <button class="btn btn-run" onclick="submitTrackForecast()">Track</button>
        <button class="btn btn-compare" onclick="document.getElementById('track-overlay').remove()">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  // Set values via JS so a quote in the question/date cannot break the markup.
  document.getElementById('track-q').value = q;
  document.getElementById('track-p').value = (prob * 100).toFixed(0);
  document.getElementById('track-by').value = by;
}

async function submitTrackForecast() {
  const metric = _trackMetric;
  const q = document.getElementById('track-q').value.trim();
  const p = parseFloat(document.getElementById('track-p').value) / 100;
  const by = document.getElementById('track-by').value || null;
  if (!q) { showToast('Enter a question', 'error'); return; }
  if (!(p >= 0 && p <= 1)) { showToast('Probability must be 0–100', 'error'); return; }
  try {
    await fetch('/api/forecast', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, predicted_prob: p, resolve_by: by, metric: metric }),
    });
    document.getElementById('track-overlay').remove();
    showToast('Forecast tracked — grade it in Predictions when the outcome is known', 'success');
  } catch (e) {
    showToast('Could not track: ' + e, 'error');
  }
}

function buildConfigFromWizard() {
  const DIST_PARAMS = {
    fixed: (p1) => ({value: p1}),
    triangular: (p1,p2,p3) => ({low:p1, mode:p2, high:p3}),
    uniform: (p1,p2) => ({low:p1, high:p2}),
    normal: (p1,p2) => ({mean:p1, std:p2}),
    lognormal: (p1,p2) => ({median:p1, spread:p2}),
    bernoulli: (p1) => ({p:p1}),
    poisson: (p1) => ({lambda:p1}),
  };

  const config = {
    name: document.getElementById('wiz-name').value || 'Custom Domain',
    n_simulations: 5000,
    n_steps: parseInt(document.getElementById('wiz-steps').value) || 12,
    step_label: document.getElementById('wiz-step-label').value || 'step',
    seed: 42,
    context: {
      decision: document.getElementById('wiz-decision').value || '',
    },
    parameters: {},
    controls: {},
    exogenous: {},
    initial_state: {},
    step_logic: [],
    accumulators: {},
    metrics: {},
    safety: { chance_constraints: [], cvar_constraints: [] },
    fitness: { components: [] },
    tunable: [],
  };

  // Variables
  document.querySelectorAll('[data-wv]').forEach(el => {
    const id = el.dataset.wv;
    const field = el.dataset.field;
    if (!wizardVars[id]) wizardVars[id] = {};
    if (wizardVars[id] === null) return;
    wizardVars[id][field] = el.value;
  });

  wizardVars.filter(v => v && v.name).forEach(v => {
    const cat = v.cat || 'parameters';
    const dist = v.dist || 'triangular';
    const p1 = parseFloat(v.p1) || 0;
    const p2 = parseFloat(v.p2) || 0;
    const p3 = parseFloat(v.p3) || 0;
    const params = DIST_PARAMS[dist] ? DIST_PARAMS[dist](p1, p2, p3) : {value: p1};
    config[cat][v.name] = { distribution: dist, params };
  });

  // Steps
  document.querySelectorAll('[data-ws]').forEach(el => {
    const id = el.dataset.ws;
    const field = el.dataset.field;
    if (!wizardSteps[id]) wizardSteps[id] = {};
    wizardSteps[id][field] = el.value;
  });

  wizardSteps.filter(s => s && s.target && s.expr).forEach(s => {
    config.step_logic.push({ target: s.target, expr: s.expr });
    // Auto-create accumulator
    config.accumulators[s.target] = config.accumulators[s.target] || s.target;
    config.initial_state[s.target] = 0;
  });

  // Metrics
  document.querySelectorAll('[data-wm]').forEach(el => {
    const id = el.dataset.wm;
    const field = el.dataset.field;
    if (!wizardMetrics[id]) wizardMetrics[id] = {};
    wizardMetrics[id][field] = el.value;
  });

  wizardMetrics.filter(m => m && m.name && m.expr).forEach(m => {
    config.metrics[m.name] = { expr: m.expr, format: m.format || 'number' };
  });

  return config;
}

function openBayesianUpdate() {
  if (!currentConfig || !currentDomain) return;

  const updatableVars = [];
  for (const cat of ['parameters', 'controls', 'exogenous']) {
    for (const [name, def] of Object.entries(currentConfig[cat] || {})) {
      if (def.calibration?.updatable !== false) {
        updatableVars.push({ name, def, cat });
      }
    }
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'bayes-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeBayesian(); };

  let formRows = updatableVars.map(v => {
    const cal = v.def.calibration || {};
    const method = cal.update_method || 'auto-detect';
    return `
      <div class="var-card">
        <div class="var-header">
          <span class="var-name">${v.name.replace(/_/g, ' ')}</span>
          <span style="font-size:10px;color:var(--text3)">${method}</span>
        </div>
        <div class="form-group">
          <label class="form-label">Observed values (comma-separated)</label>
          <input class="form-input" id="obs-${v.name}" placeholder="e.g., 0.25, 0.30, 0.28">
          <div class="form-hint">Current: ${JSON.stringify(v.def.params)}</div>
        </div>
      </div>
    `;
  }).join('');

  overlay.innerHTML = `
    <div class="modal">
      <h2>Update from Observed Data</h2>
      <div class="modal-sub">Enter real-world observations to sharpen the simulation parameters using Bayesian updating. Leave fields blank to skip.</div>

      <div class="modal-tabs" style="margin-bottom:16px">
        <div class="modal-tab active" onclick="switchBayesMode('manual',this)">Manual Entry</div>
        <div class="modal-tab" onclick="switchBayesMode('upload',this)">Upload CSV/JSON</div>
      </div>

      <div id="bayes-manual">
        ${formRows}
      </div>

      <div id="bayes-upload" style="display:none">
        <div class="form-group">
          <label class="form-label">Upload observation data</label>
          <input type="file" id="bayes-file" accept=".csv,.json,.tsv" style="font-size:12px;color:var(--text2)" onchange="parseBayesFile(this)">
          <div class="form-hint">
            CSV format: header row with variable names, values in rows. Example:<br>
            <code style="font-size:10px;color:var(--text3)">close_rate,leads_per_month,project_value<br>0.28,4,3200<br>0.32,3,4100</code>
          </div>
          <div class="form-hint" style="margin-top:6px">
            JSON format: <code style="font-size:10px;color:var(--text3)">{"close_rate": [0.28, 0.32], "leads_per_month": [4, 3]}</code>
          </div>
        </div>
        <div id="bayes-upload-preview"></div>
      </div>

      <div id="bayes-report"></div>
      <div class="modal-actions">
        <button class="btn btn-compare" onclick="closeBayesian()">Cancel</button>
        <button class="btn btn-evolve" onclick="previewBayesian()">Preview Update</button>
        <button class="btn btn-run" onclick="applyBayesian()">Apply &amp; Re-run</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeBayesian() {
  const el = document.getElementById('bayes-overlay');
  if (el) el.remove();
}

function switchBayesMode(mode, tab) {
  document.querySelectorAll('#bayes-overlay .modal-tabs .modal-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('bayes-manual').style.display = mode === 'manual' ? '' : 'none';
  document.getElementById('bayes-upload').style.display = mode === 'upload' ? '' : 'none';
}

let _uploadedObservations = null;

function parseBayesFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result.trim();
    const preview = document.getElementById('bayes-upload-preview');
    try {
      let obs;
      if (file.name.endsWith('.json')) {
        obs = JSON.parse(text);
      } else {
        // CSV/TSV parsing
        const sep = text.includes('\t') ? '\t' : ',';
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        const headers = lines[0].split(sep).map(h => h.trim().replace(/^"|"$/g, ''));
        obs = {};
        headers.forEach(h => obs[h] = []);
        for (let i = 1; i < lines.length; i++) {
          const vals = lines[i].split(sep);
          headers.forEach((h, j) => {
            const v = parseFloat(vals[j]);
            if (!isNaN(v)) obs[h].push(v);
          });
        }
        // Remove empty columns
        for (const k of Object.keys(obs)) {
          if (obs[k].length === 0) delete obs[k];
        }
      }

      _uploadedObservations = obs;
      const varNames = Object.keys(obs);
      let html = '<div style="margin-top:12px">';
      html += `<div style="font-size:11px;color:var(--green);margin-bottom:8px">Parsed ${varNames.length} variables from ${file.name}</div>`;
      varNames.forEach(name => {
        const vals = obs[name];
        html += `<div class="var-card" style="padding:8px 12px;margin-bottom:4px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600;font-size:12px">${name.replace(/_/g, ' ')}</span>
            <span style="font-size:10px;color:var(--text3);font-family:var(--mono)">${vals.length} values</span>
          </div>
          <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px">
            [${vals.slice(0, 8).map(v => typeof v === 'number' ? v.toFixed(2) : v).join(', ')}${vals.length > 8 ? ', ...' : ''}]
          </div>
        </div>`;
      });
      html += '</div>';
      preview.innerHTML = html;

      // Also fill in the manual fields
      varNames.forEach(name => {
        const el = document.getElementById('obs-' + name);
        if (el) el.value = obs[name].join(', ');
      });
    } catch(err) {
      preview.innerHTML = `<div class="validation-errors">Parse error: ${esc(err.message)}</div>`;
      _uploadedObservations = null;
    }
  };
  reader.readAsText(file);
}

function collectObservations() {
  // Prefer uploaded data if available
  if (_uploadedObservations && Object.keys(_uploadedObservations).length > 0) {
    return _uploadedObservations;
  }
  const obs = {};
  document.querySelectorAll('[id^="obs-"]').forEach(el => {
    const name = el.id.replace('obs-', '');
    const val = el.value.trim();
    if (val) {
      obs[name] = val.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
    }
  });
  return obs;
}

async function previewBayesian() {
  const observations = collectObservations();
  if (Object.keys(observations).length === 0) {
    document.getElementById('bayes-report').innerHTML = '<div class="validation-errors">Enter at least one observation.</div>';
    return;
  }

  const res = await fetch('/api/update', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ domain: currentDomain, observations })
  });
  const data = await res.json();
  if (data.error) {
    document.getElementById('bayes-report').innerHTML = `<div class="validation-errors">${esc(data.error)}</div>`;
    return;
  }

  let html = '<div style="margin-top:16px">';
  for (const [name, report] of Object.entries(data.update_report)) {
    if (report.skipped) {
      html += `<div style="font-size:11px;color:var(--text3);margin-bottom:4px">${name}: skipped (${report.reason})</div>`;
      continue;
    }
    const arrow = report.posterior_mean > report.prior_mean ? '+' : '';
    const delta = ((report.posterior_mean - report.prior_mean) / Math.abs(report.prior_mean) * 100).toFixed(1);
    html += `<div class="var-card">
      <div style="font-weight:600;font-size:12px;margin-bottom:6px">${name.replace(/_/g,' ')}</div>
      <div style="display:flex;gap:20px;font-size:11px;font-family:var(--mono)">
        <div>Prior: <span style="color:var(--text3)">${report.prior_mean}</span></div>
        <div>Posterior: <span style="color:var(--accent2)">${report.posterior_mean}</span></div>
        <div style="color:${delta > 0 ? 'var(--green)' : 'var(--amber)'}">${arrow}${delta}%</div>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">
        90% credible interval: [${report.credible_interval_90[0]}, ${report.credible_interval_90[1]}] |
        Method: ${report.method} | ${report.observations_used} observations
      </div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('bayes-report').innerHTML = html;

  // Store for apply
  window._bayesianUpdated = data.updated_config;
}

async function applyBayesian() {
  const observations = collectObservations();
  if (Object.keys(observations).length === 0) return;

  if (!window._bayesianUpdated) await previewBayesian();
  if (!window._bayesianUpdated) return;

  closeBayesian();

  // Run simulation with updated config
  const btn = document.getElementById('btn-run');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Re-running with updated priors...';
  setStatus('Running with Bayesian-updated parameters...');

  try {
    const res = await fetch('/api/simulate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        config: window._bayesianUpdated,
        n_simulations: parseInt(document.getElementById('n-sims').value),
        seed: parseInt(document.getElementById('seed').value),
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    currentResults = data;
    activeScenarioIdx = -1;
    renderResults(data);
    document.getElementById('btn-export').style.display = '';
    setStatus(`Updated & simulated: ${data.n_simulations.toLocaleString()} runs in ${data.elapsed}s`);
  } catch(e) {
    setMain(`<div class="empty-state"><div class="empty-title" style="color:var(--red)">Error</div><div class="empty-sub">${esc(e.message)}</div></div>`);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run Simulation';
    window._bayesianUpdated = null;
  }
}

// ═══════════════════════════════════════════
// MULTI-SCENARIO COMPARISON DASHBOARD
// ═══════════════════════════════════════════
function compareScenarios() {
  const all = [];
  // After a sweep, compare exactly the swept values — the pre-sweep Current
  // Run would muddy the input diff. Manual saves still include it.
  const allSwept = scenarios.length > 0 && scenarios.every(s => s.swept);
  if (currentResults && !allSwept) {
    all.push({ name: 'Current Run', results: currentResults, color: 'var(--accent)', inputs: captureInputs() });
  }
  scenarios.forEach(s => all.push(s));
  if (all.length < 2) return showToast('Save at least 2 scenarios to compare', 'info');

  const metricNames = Object.keys(all[0].results.stats);

  // Build comparison table
  let tableHtml = '<table class="compare-table"><thead><tr><th>Metric</th><th>Stat</th>';
  all.forEach(s => {
    tableHtml += `<th class="scenario-col"><div class="compare-chip"><span class="chip-color" style="background:${s.color}"></span>${esc(s.name)}</div></th>`;
  });
  tableHtml += '</tr></thead><tbody>';

  for (const mname of metricNames) {
    const f = all[0].results.stats[mname]?.format || 'number';
    for (const stat of ['median', 'mean', 'p10', 'p90']) {
      const vals = all.map(s => s.results.stats[mname]?.[stat] ?? 0);
      const best = Math.max(...vals);
      const worst = Math.min(...vals);
      const isLowerBetter = mname.includes('cost') || mname.includes('overrun') || mname.includes('drawdown') || mname.includes('churn');

      tableHtml += `<tr>
        <td class="metric-name">${stat === 'median' ? mname.replace(/_/g, ' ') : ''}</td>
        <td style="color:var(--text3);font-size:10px;text-transform:uppercase">${stat}</td>`;
      vals.forEach(v => {
        let cls = '';
        if (vals.filter(x => x !== v).length > 0) {
          if (isLowerBetter) {
            if (v === worst) cls = 'best-val';
            else if (v === best) cls = 'worst-val';
          } else {
            if (v === best) cls = 'best-val';
            else if (v === worst) cls = 'worst-val';
          }
        }
        tableHtml += `<td class="scenario-val ${cls}">${fmt(v, f)}</td>`;
      });
      tableHtml += '</tr>';
    }
  }
  tableHtml += '</tbody></table>';

  // Safety comparison
  let safetyHtml = '';
  const hasSafety = all.some(s => s.results.safety?.chance?.length || s.results.safety?.cvar?.length);
  if (hasSafety) {
    safetyHtml = '<div class="diag-section"><div class="diag-title">Safety Comparison</div>';
    safetyHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">';
    all.forEach(s => {
      const safety = s.results.safety || {};
      const total = (safety.chance?.length || 0) + (safety.cvar?.length || 0);
      const passed = (safety.chance?.filter(c=>c.passed).length || 0) + (safety.cvar?.filter(c=>c.passed).length || 0);
      const pct = total > 0 ? Math.round(passed/total*100) : 100;
      const color = pct >= 100 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
      safetyHtml += `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px">
        <div class="compare-chip" style="margin-bottom:8px"><span class="chip-color" style="background:${s.color}"></span><strong>${esc(s.name)}</strong></div>
        <div style="font-size:24px;font-weight:700;color:${color};font-family:var(--mono)">${pct}%</div>
        <div style="font-size:10px;color:var(--text3)">${passed}/${total} constraints pass</div>
        ${s.results.fitness != null ? `<div style="font-size:10px;color:var(--text3);margin-top:4px">Fitness: ${s.results.fitness.toFixed(1)}</div>` : ''}
      </div>`;
    });
    safetyHtml += '</div></div>';
  }

  // Input diff: which levers actually differ across the compared scenarios.
  let inputsHtml = '';
  if (all.every(s => s.inputs)) {
    const paths = new Set();
    all.forEach(s => Object.keys(s.inputs).forEach(p => paths.add(p)));
    const diffPaths = [...paths].filter(p => {
      const vals = all.map(s => s.inputs[p]);
      return vals.some(v => v !== vals[0]);
    });
    // Swept control first, then the rest in DOM order.
    diffPaths.sort((a, b) => (a === _sweepPath ? -1 : 0) - (b === _sweepPath ? -1 : 0));
    if (diffPaths.length) {
      let t = '<table class="compare-table"><thead><tr><th>Input</th>';
      all.forEach(s => {
        t += `<th class="scenario-col"><div class="compare-chip"><span class="chip-color" style="background:${s.color}"></span>${esc(s.name)}</div></th>`;
      });
      t += '</tr></thead><tbody>';
      for (const p of diffPaths) {
        const parts = p.split('.');
        const label = `${(parts[1] || p).replace(/_/g, ' ')} <span style="color:var(--text3)">.${parts[parts.length - 1]}</span>`;
        const isSwept = p === _sweepPath;
        t += `<tr><td class="metric-name" ${isSwept ? 'style="color:var(--accent);font-weight:600"' : ''}>${label}${isSwept ? ' ⟵ swept' : ''}</td>`;
        all.forEach(s => {
          const v = s.inputs[p];
          t += `<td class="scenario-val" ${isSwept ? 'style="font-weight:600"' : ''}>${v === undefined ? '—' : fmtParam(v, parts[parts.length - 1])}</td>`;
        });
        t += '</tr>';
      }
      t += '</tbody></table>';
      inputsHtml = `<div class="diag-section">
        <div class="diag-title">Inputs That Differ</div>
        <div class="diag-subtitle">Only levers with different values across scenarios are shown — these differences drive everything below.</div>
        ${t}
      </div>`;
    }
  }

  let html = `
    <div class="results-header">
      <h2>Scenario Comparison</h2>
      <span class="results-meta">${all.length} scenarios</span>
    </div>
    ${inputsHtml}
    <div class="diag-section">
      <div class="diag-title">Metrics Side by Side</div>
      <div class="diag-subtitle">Green = best value, Red = worst. For cost/risk metrics, lower is better.</div>
      ${tableHtml}
    </div>
    ${safetyHtml}
    <div class="diag-section">
      <div class="diag-title">Overlaid Distributions</div>
      <canvas id="compare-canvas" height="280"></canvas>
    </div>`;

  setMain(html);
  requestAnimationFrame(() => drawCompareHistograms(all, metricNames[0]));
}

function drawCompareHistograms(allScenarios, metric) {
  const canvas = document.getElementById('compare-canvas');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 280 * dpr;
  canvas.style.height = '280px';
  ctx.scale(dpr, dpr);
  const W = rect.width, H = 280;

  const pad = { top: 24, right: 20, bottom: 40, left: 65 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  ctx.fillStyle = '#0f1219';
  ctx.fillRect(0, 0, W, H);

  // Collect all values to determine shared range
  let globalMin = Infinity, globalMax = -Infinity;
  allScenarios.forEach(s => {
    const h = s.results.histograms?.[metric];
    if (h) { globalMin = Math.min(globalMin, h.lo); globalMax = Math.max(globalMax, h.hi); }
  });
  if (!isFinite(globalMin)) return;

  const n_bins = 40;
  const binWidth = (globalMax - globalMin) / n_bins;

  // Rebin all scenarios onto shared grid
  const scenarioBins = allScenarios.map(s => {
    const h = s.results.histograms?.[metric];
    if (!h) return new Array(n_bins).fill(0);
    const bins = new Array(n_bins).fill(0);
    const total = h.counts.reduce((a,b) => a+b, 0);
    for (let i = 0; i < h.bins.length; i++) {
      const binCenter = h.bins[i] + (h.bin_width || 0) / 2;
      const idx = Math.min(n_bins - 1, Math.max(0, Math.floor((binCenter - globalMin) / binWidth)));
      bins[idx] += h.counts[i] / total;  // normalize
    }
    return bins;
  });

  const maxDensity = Math.max(...scenarioBins.flat());
  const barW = cw / n_bins;

  const colors = allScenarios.map(s => {
    const c = s.color || 'var(--accent)';
    // Parse CSS var colors
    if (c.startsWith('#')) return c;
    if (c.includes('accent')) return '#3b82f6';
    if (c.includes('amber') || c === '#f59e0b') return '#f59e0b';
    if (c.includes('green') || c === '#22c55e') return '#22c55e';
    if (c.includes('purple') || c === '#a78bfa') return '#a78bfa';
    if (c.includes('red') || c === '#ef4444') return '#ef4444';
    if (c.includes('cyan') || c === '#22d3ee') return '#22d3ee';
    return c;
  });

  // Draw overlaid bars with transparency
  scenarioBins.forEach((bins, si) => {
    const color = colors[si];
    for (let i = 0; i < n_bins; i++) {
      const barH = (bins[i] / maxDensity) * ch;
      const x = pad.left + i * barW;
      const y = pad.top + ch - barH;
      ctx.fillStyle = color + '55'; // semi-transparent
      ctx.fillRect(x + 1, y, Math.max(1, barW - 2), barH);
    }
    // Outline
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < n_bins; i++) {
      const barH = (bins[i] / maxDensity) * ch;
      const x = pad.left + i * barW + barW / 2;
      const y = pad.top + ch - barH;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  });

  // X axis
  const mono = getComputedStyle(document.body).getPropertyValue('--mono');
  const f = allScenarios[0].results.stats[metric]?.format || 'number';
  ctx.fillStyle = '#475569';
  ctx.font = '10px ' + mono;
  ctx.textAlign = 'center';
  for (let i = 0; i <= 5; i++) {
    const v = globalMin + (globalMax - globalMin) * (i / 5);
    const x = pad.left + (i / 5) * cw;
    ctx.fillText(fmt(v, f), x, H - 8);
  }

  // Legend
  ctx.font = '11px ' + mono;
  allScenarios.forEach((s, i) => {
    const lx = pad.left + i * 140;
    ctx.fillStyle = colors[i];
    ctx.fillRect(lx, pad.top - 16, 10, 10);
    ctx.fillStyle = '#94a3b8';
    ctx.textAlign = 'left';
    ctx.fillText(s.name, lx + 14, pad.top - 7);
  });

  // Title
  ctx.fillStyle = '#64748b';
  ctx.font = '10px ' + getComputedStyle(document.body).getPropertyValue('--font');
  ctx.textAlign = 'center';
  ctx.fillText(metric.replace(/_/g, ' ') + ' — overlaid distributions', W / 2, H - 24);
}

function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function showLoading(msg, sub) {
  const el = document.createElement('div');
  el.className = 'loading-overlay';
  el.id = 'loading-overlay';
  el.innerHTML = `<div class="loading-box">
    <div class="spinner-large"></div>
    <div class="loading-text">${esc(msg)}</div>
    ${sub ? `<div class="loading-sub">${esc(sub)}</div>` : ''}
  </div>`;
  document.body.appendChild(el);
}

function hideLoading() {
  const el = document.getElementById('loading-overlay');
  if (el) el.remove();
}

// ═══════════════════════════════════════════
// DIAGNOSTICS: CONVERGENCE
// ═══════════════════════════════════════════
async function runConvergence() {
  if (!currentDomain) return showToast('Select a domain first', 'error');
  showLoading('Running convergence analysis', 'Testing sample sizes up to 10,000...');

  try {
    const metric = currentResults ? Object.keys(currentResults.stats)[0] : null;
    const res = await fetch('/api/convergence', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ domain: currentDomain, metric, max_runs: 10000 })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderConvergence(data);
    showToast(`Convergence: ${data.assessment}`, data.convergence_n ? 'success' : 'info');
  } catch(e) {
    showToast('Convergence error: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

function renderConvergence(data) {
  const main = document.getElementById('main');
  let html = `
    <div class="results-header">
      <h2>Convergence Analysis</h2>
      <span class="results-meta">${data.elapsed}s &middot; ${data.total_runs.toLocaleString()} max runs</span>
    </div>
    <div class="diag-section">
      <div class="diag-title">Estimator Stability: ${esc(data.metric.replace(/_/g, ' '))}</div>
      <div class="diag-subtitle">
        ${data.convergence_n
          ? `Converged at <strong style="color:var(--green)">N=${data.convergence_n.toLocaleString()}</strong> (95% CI &lt; 5% of mean)`
          : `<span style="color:var(--amber)">Did not converge within ${data.total_runs.toLocaleString()} runs</span>`}
      </div>
      <table class="conv-table">
        <tr><th>N</th><th>Mean</th><th>Median</th><th>SE(mean)</th><th>95% CI</th><th>P10</th><th>P90</th></tr>
        ${data.checkpoints.map(r => {
          const ci = r.ci95_pct < 999 ? r.ci95_pct.toFixed(1) + '%' : '>999%';
          const converged = data.convergence_n && r.n >= data.convergence_n;
          return `<tr class="${converged ? 'converged' : ''}">
            <td>${r.n.toLocaleString()}</td>
            <td>${r.mean.toLocaleString()}</td>
            <td>${r.median.toLocaleString()}</td>
            <td>${r.se_mean.toLocaleString()}</td>
            <td>${ci}</td>
            <td>${r.p10.toLocaleString()}</td>
            <td>${r.p90.toLocaleString()}</td>
          </tr>`;
        }).join('')}
      </table>
    </div>
    <div class="diag-section">
      <div class="diag-title">Convergence Chart</div>
      <canvas id="conv-canvas" height="260"></canvas>
    </div>`;

  if (data.final_stability?.mean_drift_pct != null) {
    html += `<div class="diag-section">
      <div class="diag-title">Final Stability</div>
      <div style="display:flex;gap:24px;font-size:12px;font-family:var(--mono)">
        <div>Mean drift: <span style="color:${data.final_stability.mean_drift_pct < 1 ? 'var(--green)' : 'var(--amber)'}">${data.final_stability.mean_drift_pct.toFixed(2)}%</span></div>
        <div>P10 drift: <span style="color:${data.final_stability.p10_drift_pct < 2 ? 'var(--green)' : 'var(--amber)'}">${data.final_stability.p10_drift_pct.toFixed(2)}%</span></div>
        <div>P90 drift: <span style="color:${data.final_stability.p90_drift_pct < 2 ? 'var(--green)' : 'var(--amber)'}">${data.final_stability.p90_drift_pct.toFixed(2)}%</span></div>
      </div>
    </div>`;
  }

  main.innerHTML = html;
  requestAnimationFrame(() => drawConvergenceChart(data));
}

function drawConvergenceChart(data) {
  const canvas = document.getElementById('conv-canvas');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 260 * dpr;
  canvas.style.height = '260px';
  ctx.scale(dpr, dpr);
  const W = rect.width, H = 260;

  const pts = data.checkpoints;
  const means = pts.map(p => p.mean);
  const p10s = pts.map(p => p.p10);
  const p90s = pts.map(p => p.p90);
  const allVals = [...means, ...p10s, ...p90s];
  const minV = Math.min(...allVals) * 0.95;
  const maxV = Math.max(...allVals) * 1.05;
  const pad = { top: 20, right: 20, bottom: 30, left: 70 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;
  const rangeV = maxV - minV || 1;
  const n = pts.length;

  function x(i) { return pad.left + (i / Math.max(1, n-1)) * cw; }
  function y(v) { return pad.top + ch - ((v - minV) / rangeV) * ch; }

  ctx.fillStyle = '#0f1219';
  ctx.fillRect(0, 0, W, H);

  const mono = getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.font = '10px ' + mono;
  ctx.strokeStyle = '#1a2236'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const yy = pad.top + (ch/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(W-pad.right, yy); ctx.stroke();
    ctx.fillStyle = '#475569'; ctx.textAlign = 'right';
    const val = maxV - (rangeV/4)*i;
    ctx.fillText(Math.round(val).toLocaleString(), pad.left-8, yy+4);
  }

  // X labels
  ctx.fillStyle = '#475569'; ctx.textAlign = 'center';
  pts.forEach((p, i) => {
    if (i % Math.max(1, Math.floor(n/6)) === 0 || i === n-1)
      ctx.fillText(p.n.toLocaleString(), x(i), H-8);
  });

  // P10-P90 band
  ctx.fillStyle = 'rgba(59, 130, 246, 0.08)';
  ctx.beginPath();
  for (let i = 0; i < n; i++) { i === 0 ? ctx.moveTo(x(i), y(p90s[i])) : ctx.lineTo(x(i), y(p90s[i])); }
  for (let i = n-1; i >= 0; i--) ctx.lineTo(x(i), y(p10s[i]));
  ctx.closePath(); ctx.fill();

  // P10/P90 dashed
  ctx.strokeStyle = 'rgba(59,130,246,0.25)'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
  ctx.beginPath(); for (let i=0;i<n;i++){i===0?ctx.moveTo(x(i),y(p10s[i])):ctx.lineTo(x(i),y(p10s[i]));} ctx.stroke();
  ctx.beginPath(); for (let i=0;i<n;i++){i===0?ctx.moveTo(x(i),y(p90s[i])):ctx.lineTo(x(i),y(p90s[i]));} ctx.stroke();

  // Mean line
  ctx.setLineDash([]);
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i=0;i<n;i++){i===0?ctx.moveTo(x(i),y(means[i])):ctx.lineTo(x(i),y(means[i]));}
  ctx.stroke();

  // Convergence marker
  if (data.convergence_n) {
    const ci = pts.findIndex(p => p.n >= data.convergence_n);
    if (ci >= 0) {
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(x(ci), pad.top); ctx.lineTo(x(ci), pad.top + ch); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#22c55e'; ctx.font = '10px ' + mono; ctx.textAlign = 'center';
      ctx.fillText('converged N=' + data.convergence_n.toLocaleString(), x(ci), pad.top - 4);
    }
  }

  // Legend
  const lx = W - pad.right - 100;
  ctx.font = '10px ' + mono;
  ctx.fillStyle = '#3b82f6'; ctx.textAlign = 'left'; ctx.fillText('Mean', lx, pad.top + 14);
  ctx.fillStyle = 'rgba(59,130,246,0.4)'; ctx.fillText('P10 / P90', lx, pad.top + 28);
}

// ═══════════════════════════════════════════
// DIAGNOSTICS: SENSITIVITY (TORNADO CHART)
// ═══════════════════════════════════════════
async function runSensitivity() {
  if (!currentDomain) return showToast('Select a domain first', 'error');
  showLoading('Running sensitivity analysis', 'Perturbing each parameter to measure impact...');

  try {
    const metric = currentResults ? Object.keys(currentResults.stats)[0] : null;
    const res = await fetch('/api/sensitivity', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ domain: currentDomain, metric, n_base: 1000, n_perturb: 5 })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderSensitivity(data);
    showToast(`Sensitivity: ${data.sensitivities.length} parameters ranked`, 'success');
  } catch(e) {
    showToast('Sensitivity error: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

function renderSensitivity(data) {
  const main = document.getElementById('main');
  const top = data.sensitivities.slice(0, 15);
  const maxImpact = top.length > 0 ? top[0].avg_impact_on_mean : 1;

  const colors = ['#3b82f6','#60a5fa','#93bbfc','#a78bfa','#c4b5fd','#22d3ee',
                  '#67e8f9','#f59e0b','#fbbf24','#fcd34d','#22c55e','#4ade80',
                  '#86efac','#ef4444','#f87171'];

  let tornadoHtml = top.map((s, i) => {
    const pct = (s.avg_impact_on_mean / maxImpact) * 100;
    const label = `${s.variable}.${s.parameter}`;
    return `<div class="tornado-bar-row">
      <div class="tornado-label" title="${label}">${label.replace(/_/g, ' ')}</div>
      <div class="tornado-bar-container">
        <div class="tornado-bar" style="width:${pct}%;background:${colors[i % colors.length]}"></div>
      </div>
      <div class="tornado-value">${s.relative_importance >= 0.01 ? (s.relative_importance * 100).toFixed(1) + '%' : '<1%'}</div>
    </div>`;
  }).join('');

  let html = `
    <div class="results-header">
      <h2>Sensitivity Analysis</h2>
      <span class="results-meta">${data.elapsed}s &middot; ${data.sensitivities.length} parameters</span>
    </div>
    <div class="diag-section">
      <div class="diag-title">Tornado Chart: ${esc(data.metric.replace(/_/g, ' '))}</div>
      <div class="diag-subtitle">
        Which input parameters drive the most variance in the output?
        Baseline mean: <strong style="color:var(--accent2)">${fmt(data.base_mean, data.sensitivities[0]?.base_value > 1 ? 'dollar' : 'number')}</strong>
      </div>
      ${tornadoHtml}
    </div>
    <div class="diag-section">
      <div class="diag-title">Detail Table</div>
      <table class="conv-table">
        <tr><th>#</th><th>Variable.Parameter</th><th>Base Value</th><th>Impact on Mean</th><th>Elasticity</th><th>Rel. Importance</th></tr>
        ${data.sensitivities.map((s, i) => `<tr>
          <td>${i+1}</td>
          <td>${s.variable}.${s.parameter}</td>
          <td>${typeof s.base_value === 'number' ? s.base_value.toLocaleString(undefined, {maximumFractionDigits: 4}) : s.base_value}</td>
          <td>${s.avg_impact_on_mean.toLocaleString()}</td>
          <td>${s.elasticity.toFixed(3)}</td>
          <td>${(s.relative_importance * 100).toFixed(1)}%</td>
        </tr>`).join('')}
      </table>
    </div>`;

  main.innerHTML = html;
}

// ═══════════════════════════════════════════
// DIAGNOSTICS: BASELINE COMPARISON
// ═══════════════════════════════════════════
async function runBaseline() {
  if (!currentDomain) return showToast('Select a domain first', 'error');
  showLoading('Running baseline comparison', 'Deterministic forecast vs Monte Carlo...');

  try {
    const res = await fetch('/api/baseline', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        domain: currentDomain,
        n_simulations: parseInt(document.getElementById('n-sims').value)
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderBaseline(data);
    showToast('Baseline comparison complete', 'success');
  } catch(e) {
    showToast('Baseline error: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

function renderBaseline(data) {
  const main = document.getElementById('main');

  let compRows = '';
  for (const [name, c] of Object.entries(data.comparison)) {
    const f = c.format || 'number';
    compRows += `
      <div class="baseline-row">
        <div style="color:var(--text)">${name.replace(/_/g, ' ')}</div>
        <div>${fmt(c.deterministic, f)}</div>
        <div>${fmt(c.mc_median, f)}</div>
        <div>${fmt(c.mc_p10, f)} to ${fmt(c.mc_p90, f)}</div>
        <div class="baseline-hidden-risk">${fmt(c.downside_hidden_by_deterministic, f)}</div>
      </div>`;
  }

  let html = `
    <div class="results-header">
      <h2>Baseline Comparison</h2>
      <span class="results-meta">${data.elapsed}s &middot; ${data.n_simulations.toLocaleString()} sims</span>
    </div>
    <div class="diag-section">
      <div class="diag-title">Deterministic (Spreadsheet) vs Monte Carlo</div>
      <div class="diag-subtitle">
        The deterministic forecast uses the mode/mean of each distribution — the "most likely" value.
        Monte Carlo reveals the <strong>range</strong> of outcomes that a single-point forecast hides.
      </div>
      <div class="baseline-row header">
        <div>Metric</div>
        <div>Spreadsheet</div>
        <div>MC Median</div>
        <div>80% Range (P10-P90)</div>
        <div>Hidden Downside</div>
      </div>
      ${compRows}
    </div>
    <div class="diag-section">
      <div class="diag-title">Verdict</div>
      <div style="font-size:13px;color:var(--text);line-height:1.6">
        ${esc(data.verdict)}. The "Hidden Downside" column shows how much worse things could be
        compared to the spreadsheet forecast — risk that deterministic planning completely ignores.
      </div>
    </div>`;

  main.innerHTML = html;
}

// ═══════════════════════════════════════════
// SHAREABLE CONFIG URLS
// ═══════════════════════════════════════════
function shareConfig() {
  if (!currentConfig) return showToast('No config loaded', 'error');
  const json = JSON.stringify(currentConfig);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  const url = window.location.origin + '/#config=' + encoded;

  // Copy to clipboard
  navigator.clipboard.writeText(url).then(() => {
    showToast('Share URL copied to clipboard', 'success');
  }).catch(() => {
    // Fallback
    prompt('Share URL (copy it):', url);
  });
}

function shareCurrentRun() {
  if (!currentConfig || !currentResults) return showToast('Run a simulation first', 'error');
  const payload = {
    config: currentConfig,
    overrides: collectOverrides(),
    n_simulations: parseInt(document.getElementById('n-sims').value),
    seed: parseInt(document.getElementById('seed').value),
  };
  const json = JSON.stringify(payload);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  const url = window.location.origin + '/#run=' + encoded;

  navigator.clipboard.writeText(url).then(() => {
    showToast('Run URL copied — recipient will auto-simulate', 'success');
  }).catch(() => {
    prompt('Share URL (copy it):', url);
  });
}

async function loadFromHash() {
  const hash = window.location.hash.slice(1);
  if (!hash) return;

  try {
    if (hash.startsWith('config=')) {
      const json = decodeURIComponent(escape(atob(hash.slice(7))));
      const config = JSON.parse(json);
      // Save as temporary domain and load it
      const res = await fetch('/api/save-domain', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ config, filename: config.name || 'shared' })
      });
      const data = await res.json();
      if (data.saved) {
        await loadDomains();
        selectDomain(data.file);
        showToast('Loaded shared config: ' + (config.name || 'shared'), 'success');
      }
    } else if (hash.startsWith('run=')) {
      const json = decodeURIComponent(escape(atob(hash.slice(4))));
      const payload = JSON.parse(json);
      // Save config, then run
      const config = payload.config;
      const saveRes = await fetch('/api/save-domain', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ config, filename: config.name || 'shared' })
      });
      const saveData = await saveRes.json();
      if (saveData.saved) {
        await loadDomains();
        await selectDomain(saveData.file);
        // Set simulation params
        if (payload.n_simulations) document.getElementById('n-sims').value = payload.n_simulations;
        if (payload.seed) document.getElementById('seed').value = payload.seed;
        // Auto-run
        showToast('Auto-running shared simulation...', 'info');
        setTimeout(() => runSimulation(), 300);
      }
    }
  } catch(e) {
    showToast('Failed to load shared URL: ' + e.message, 'error');
  }
  // Clear hash so it doesn't reload on refresh
  history.replaceState(null, '', window.location.pathname);
}

// INIT
// ═══════════════════════════════════════════
window.addEventListener('resize', () => {
  if (activeHistogram) drawHistogram(activeHistogram);
  if (activeTrajectory) drawTrajectory(activeTrajectory);
});

loadDomains().then(() => loadFromHash());
