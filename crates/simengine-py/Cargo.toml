[package]
name = "simengine-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"

[lib]
name = "simengine_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
pythonize = "0.23"
serde = { version = "1", features = ["derive"] }
simengine-core = { path = "../simengine-core" }
